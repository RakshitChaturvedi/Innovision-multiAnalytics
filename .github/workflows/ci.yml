name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy shared/ --ignore-missing-imports

  test-shared:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run shared tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: uv run pytest tests/shared/ -v

  smoke-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create consumer groups
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: uv run python scripts/create_consumer_groups.py

      - name: Run smoke test
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: uv run python -m scripts.smoke_test

env:
  REDIS_HOST: localhost
  REDIS_PORT: 6379

  POSTGRES_USER: test
  POSTGRES_PASSWORD: test
  DATABASE_URL: postgresql://test:test@localhost/test

  MINIO_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: test
  MINIO_SECRET_KEY: test
  MINIO_SECURE: false

  GRAFANA_PASSWORD: test

  JWT_SECRET: test-secret
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
