name: CI

on:
  push:
    branches:
      - main
      - develop
      - "rakshit/**"
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            ruff \
            mypy \
            pydantic \
            pydantic-settings \
            sqlalchemy \
            redis

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy shared/ --ignore-missing-imports

  test-shared:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            pytest \
            pytest-asyncio \
            pydantic \
            pydantic-settings \
            sqlalchemy \
            redis \
            minio

      - name: Run shared tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest tests/shared/ -v

  smoke-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            redis \
            pydantic \
            pydantic-settings

      - name: Create consumer groups
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python scripts/create_consumer_groups.py

#      - name: Run smoke test
#        env:
#          REDIS_HOST: localhost
#          REDIS_PORT: 6379
#        run: |
#          python scripts/smoke_test.py